<!-- @dsCard group="Spacing" viewport="700x180" name="Space Scale" subtitle="Gaps measured off the source frames, 8px → 75px" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-inter);font-size:11px;box-sizing:border-box;background:#fff;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .bar{background:var(--brand-800);height:12px;}
</style>
</head>
<body>
  <div class="row"><div class="bar" style="width:var(--space-2xs)"></div>2xs · 8px</div>
  <div class="row"><div class="bar" style="width:var(--space-xs)"></div>xs · 12px</div>
  <div class="row"><div class="bar" style="width:var(--space-sm)"></div>sm · 16px</div>
  <div class="row"><div class="bar" style="width:var(--space-md)"></div>md · 24px</div>
  <div class="row"><div class="bar" style="width:var(--space-lg)"></div>lg · 39px</div>
  <div class="row"><div class="bar" style="width:var(--space-xl)"></div>xl · 55px</div>
  <div class="row"><div class="bar" style="width:var(--space-2xl)"></div>2xl · 75px</div>
</body>
</html>
