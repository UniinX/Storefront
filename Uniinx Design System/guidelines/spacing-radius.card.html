<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-inter);font-size:11px;box-sizing:border-box;background:#fff;display:flex;gap:14px;align-items:flex-end;}
  .box{background:var(--mist);width:64px;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;}
</style>
</head>
<body>
  <div class="box" style="border-radius:var(--radius-sm)">sm 9</div>
  <div class="box" style="border-radius:var(--radius-md)">md 17</div>
  <div class="box" style="border-radius:var(--radius-lg)">lg 23</div>
  <div class="box" style="border-radius:var(--radius-xl)">xl 41</div>
  <div class="box" style="border-radius:var(--radius-full)">full</div>
</body>
</html>
