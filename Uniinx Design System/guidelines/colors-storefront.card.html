<!-- @dsCard group="Colors" viewport="700x150" name="Raw Storefront Fills" subtitle="Uniinx grays, ink/paper — used directly, not promoted to variables" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-inter);box-sizing:border-box;background:#fff;}
  .row{display:flex;gap:8px;}
  .swatch{flex:1;height:64px;border-radius:6px;border:1px solid #eee;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;}
  .swatch.light{color:#000;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:var(--ink)">ink</div>
    <div class="swatch light" style="background:var(--paper);border-color:#ddd">paper</div>
    <div class="swatch light" style="background:var(--paper-soft);border-color:#ddd">paper-soft</div>
    <div class="swatch light" style="background:var(--mist)">mist</div>
    <div class="swatch" style="background:var(--stone)">stone</div>
    <div class="swatch" style="background:var(--slate-mid)">slate-mid</div>
    <div class="swatch" style="background:var(--graphite)">graphite</div>
  </div>
</body>
</html>
