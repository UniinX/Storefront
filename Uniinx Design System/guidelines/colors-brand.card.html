<!-- @dsCard group="Colors" viewport="700x170" name="Brand Neutral Scale" subtitle="Grayscale ramp used as placeholder fills + button tones" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-inter);box-sizing:border-box;background:#fff;}
  .row{display:flex;gap:8px;}
  .swatch{flex:1;height:64px;border-radius:6px;display:flex;align-items:flex-end;padding:6px;font-size:11px;color:#fff;}
  .swatch.light{color:#000;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch light" style="background:var(--brand-100)">100</div>
    <div class="swatch light" style="background:var(--brand-200)">200</div>
    <div class="swatch light" style="background:var(--brand-300)">300</div>
    <div class="swatch light" style="background:var(--brand-400)">400</div>
    <div class="swatch" style="background:var(--brand-600)">600</div>
    <div class="swatch" style="background:var(--brand-700)">700</div>
    <div class="swatch" style="background:var(--brand-800)">800</div>
  </div>
</body>
</html>
