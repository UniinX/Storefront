<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#fff;color:#000;box-sizing:border-box;}</style>
</head>
<body>
  <div style="padding:28px 32px;">
    <div style="font-family:var(--font-work-sans);font-size:18px;letter-spacing:-0.02em;">Ux</div>
