<!-- @dsCard group="Uniinx Storefront" viewport="1280x900" name="Product Page — Floating Canvas" subtitle="Alt PDP: open studio canvas, floating chrome (draw-your-polo-style composition), no 3D/drawing tool" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uniinx — Product (Floating Canvas)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--paper); }
  * { -webkit-tap-highlight-color: transparent; }

  /* ---- Open studio canvas ---- */
  .uniinx-pdp-canvas-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--mist) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    opacity: 0.5;
    pointer-events: none;
  }
  .uniinx-pdp-canvas-stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 140px 240px;
    box-sizing: border-box;
  }

  /* ---- Floating chrome ---- */
  .uniinx-floating-pill {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--paper);
    border-radius: 999px;
    padding: 6px 18px 6px 6px;
    box-shadow: 0 12px 28px -14px rgba(20,16,14,0.3);
  }
  .uniinx-pdp-back-pill { top: 28px; left: 28px; }

  .uniinx-floating-card {
    position: absolute;
    z-index: 5;
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 48px -20px rgba(20,16,14,0.32);
    padding: 24px 26px;
  }
  .uniinx-pdp-info-card { left: 28px; bottom: 28px; width: 280px; }

  .uniinx-pdp-rail {
    position: absolute;
    top: 50%;
    right: 28px;
    transform: translateY(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .uniinx-pdp-rail-item {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--paper);
    overflow: hidden;
    transition: transform 0.2s cubic-bezier(.16,.84,.32,1);
  }
  .uniinx-pdp-rail-item:hover { transform: scale(1.06); }
  .uniinx-pdp-rail-item:active { transform: scale(0.96); }

  .uniinx-pdp-rail-mobile {
    display: none;
  }

  /* ---- Fabric-photo placeholders (shared vocabulary) ---- */
  .uniinx-fabric {
    position: relative;
    background-color: var(--paper-warm);
    background-image:
      radial-gradient(140% 100% at 15% 0%, var(--fabric-a, var(--kalamkari-red-600)) 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 100%, var(--fabric-b, var(--kalamkari-ochre-500)) 0%, transparent 60%),
      linear-gradient(165deg, var(--paper-sand) 0%, var(--paper-warm) 100%);
    background-blend-mode: multiply, multiply, normal;
    overflow: hidden;
  }
  .uniinx-fabric[data-tone="teal"]   { --fabric-a: var(--kalamkari-teal-600);  --fabric-b: var(--kalamkari-green-700); }
  .uniinx-fabric[data-tone="ochre"]  { --fabric-a: var(--kalamkari-ochre-500); --fabric-b: var(--kalamkari-red-600); }
  .uniinx-fabric[data-tone="green"]  { --fabric-a: var(--kalamkari-green-700); --fabric-b: var(--kalamkari-teal-600); }
  .uniinx-fabric[data-tone="maroon"] { --fabric-a: var(--kalamkari-maroon-900); --fabric-b: var(--kalamkari-ochre-500); }

  .uniinx-chip { transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease; }
  .uniinx-chip:active { transform: scale(0.94); }

  .uniinx-hide-desktop { display: none; }
  .uniinx-sticky-buy {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    background: var(--paper);
    box-shadow: 0 -1px 0 var(--mist);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 55;
  }

  @media (max-width: 860px) {
    .uniinx-hide-mobile { display: none !important; }
    .uniinx-hide-desktop { display: flex !important; }
    .uniinx-pdp-canvas-stage { padding: 100px 24px 40px; }
    .uniinx-pdp-info-card { display: none; }
    .uniinx-pdp-rail-mobile {
      position: fixed;
      left: 0; right: 0;
      bottom: 76px;
      z-index: 54;
      display: flex;
      gap: 12px;
      padding: 10px 20px;
      overflow-x: auto;
      background: var(--paper);
    }
    .uniinx-pdp-rail-mobile .uniinx-pdp-rail-item { width: 48px; height: 48px; flex: none; }
    body { padding-bottom: 132px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Motion.jsx"></script>
<script type="text/babel" src="ProductPageFloating.jsx"></script>
<script type="text/babel">
  function Demo() {
    const [cart, setCart] = React.useState([]);
    return (
      <window.ProductPageFloating
        onBack={() => {}}
        onAddToCart={(item) => setCart((c) => [...c, item])}
      />
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
